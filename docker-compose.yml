version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: caribwayz_db
    environment:
      POSTGRES_DB: caribwayz
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: caribwayz_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: caribwayz_api
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: caribwayz
      DB_USER: postgres
      DB_PASSWORD: caribwayz_pass
      JWT_SECRET: change_this_secret_in_production
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: caribwayz_web
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
